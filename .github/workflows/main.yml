name: Ultra Proxy Scraper

on:
  schedule:
    - cron: '0 */6 * * *'  # runs every 6 hours
  workflow_dispatch:        # manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install aiohttp aiofiles colorama tqdm

      - name: Run proxy scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sed -i "s|YOUR_BOT_TOKEN_HERE|$TELEGRAM_BOT_TOKEN|g" proxy_scraper.py
          sed -i "s|YOUR_CHAT_ID_HERE|$TELEGRAM_CHAT_ID|g" proxy_scraper.py
          python proxy_scraper.py

      - name: Upload proxies as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proxies-${{ github.run_number }}
          path: proxies_*.txt
          retention-days: 3
